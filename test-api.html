<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste API Fornecedores</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .result { margin-top: 20px; padding: 10px; border: 1px solid #ccc; background: #f5f5f5; }
        pre { overflow-x: auto; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Teste API Fornecedores</h1>
    <button onclick="testLogin()">🔐 Fazer Login</button>
    <button onclick="testSuppliers()">📋 Listar Fornecedores</button>
    <div class="result" id="result"></div>

    <script>
        let token = null;

        async function testLogin() {
            try {
                const response = await fetch('http://localhost:3333/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'admin@sistema.com',
                        password: 'admin123'
                    })
                });
                
                const data = await response.json();
                token = data.token;
                
                document.getElementById('result').innerHTML = `
                    <h3>✅ Login bem-sucedido!</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                document.getElementById('result').innerHTML = `<h3>❌ Erro: ${error.message}</h3>`;
            }
        }

        async function testSuppliers() {
            if (!token) {
                alert('⚠️  Faça login primeiro!');
                return;
            }

            try {
                const response = await fetch('http://localhost:3333/api/suppliers', {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                
                document.getElementById('result').innerHTML = `
                    <h3>✅ Fornecedores obtidos (${data.length} total)</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                document.getElementById('result').innerHTML = `<h3>❌ Erro: ${error.message}</h3>`;
            }
        }
    </script>
</body>
</html>
